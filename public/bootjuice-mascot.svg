<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" class="mascot" preserveAspectRatio="xMidYMax meet">
  <defs>
    <linearGradient id="skin-h" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5A3420"></stop>
      <stop offset="0.55" stop-color="#6B3A22"></stop>
      <stop offset="1" stop-color="#4A2A18"></stop>
    </linearGradient>
    <linearGradient id="shirt-h" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF4E0"></stop>
      <stop offset="1" stop-color="#FBE9CF"></stop>
    </linearGradient>
  </defs>
  <style>
    .bj-kick-leg { transform-origin: 140px 180px; transform-box: view-box; animation: bj-kick 3.8s cubic-bezier(.4,.1,.3,1) infinite; }
    .bj-head     { transform-origin: 140px 70px;  transform-box: view-box; animation: bj-headBob 3.8s ease-in-out infinite; }
    .bj-sparkles { transform-origin: 60px 284px;  transform-box: view-box; animation: bj-sparkleFlash 3.8s infinite; opacity: 0; }
    @keyframes bj-kick {
      0%, 22%   { transform: rotate(0deg); }
      26%       { transform: rotate(-18deg); }
      30%       { transform: rotate(45deg); }
      36%       { transform: rotate(32deg); }
      45%, 100% { transform: rotate(0deg); }
    }
    @keyframes bj-headBob {
      0%, 24%   { transform: translate(0,0) rotate(0); }
      28%       { transform: translate(-4px,-2px) rotate(-4deg); }
      32%       { transform: translate(2px,0) rotate(3deg); }
      45%, 100% { transform: translate(0,0) rotate(0); }
    }
    @keyframes bj-sparkleFlash {
      0%, 28% { opacity: 0; }
      32%     { opacity: 1; }
      40%     { opacity: 0; }
      100%    { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bj-kick-leg, .bj-head, .bj-sparkles { animation: none; }
      .bj-sparkles { opacity: 1; }
    }
  </style>
  <ellipse cx="140" cy="310" rx="90" ry="8" fill="#141414" opacity="0.35"></ellipse>
